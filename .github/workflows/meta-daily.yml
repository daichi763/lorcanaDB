name: 最新環境情報の日次更新

# 仕様§6: メイン更新は毎日 22:00 JST。
# Workers には1リクエストあたりのCPU/実行時間の上限があるため、
# collect（1ソース/回）→ ocr（画像2枚/回）→ aggregate → summarize → memory の順に
# 外部から呼び出して分割実行する。
on:
  schedule:
    # GitHub Actions の cron は UTC。22:00 JST = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      skip_summarize:
        description: '要約をスキップ（収集のみ）'
        type: boolean
        default: false

concurrency:
  group: meta-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 管理セッションを取得
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
          PW: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${PW:-}" ]; then
            echo "::error::SITE_BASE_URL / ADMIN_PASSWORD シークレットが未設定です"
            exit 1
          fi
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -c /tmp/cookie.txt -X POST "$BASE/api/_ops/login" \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg p "$PW" '{password:$p}')")
          if [ "$code" != "200" ]; then
            echo "::error::ログイン失敗 HTTP $code"; cat /tmp/login.json; exit 1
          fi
          echo "ログイン成功"

      - name: 収集（done になるまで1ソースずつ）
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          # 上限を設けて無限ループを避ける。ソース数より十分大きい値
          for i in $(seq 1 40); do
            out=$(curl -sS -b /tmp/cookie.txt -X POST "$BASE/api/_ops/meta/collect" \
              -H 'content-type: application/json' -d '{}')
            echo "[$i] $out"
            # jq の `//` は false も「空」扱いするため、真偽値は if-then-else で厳密に判定する
            fin=$(echo "$out" | jq -r 'if .done == true then "yes" else "no" end' 2>/dev/null || echo no)
            rest=$(echo "$out" | jq -r 'if .remaining == null then 0 else .remaining end' 2>/dev/null || echo 0)
            if [ "$fin" = "yes" ] && [ "$rest" = "0" ]; then
              echo "収集完了"; break
            fi
            # 相手サイトへの負荷を避けるため各ソース間で待つ
            sleep 5
          done

      - name: 画像OCR（公式告知画像の文字を読む・仕様§9-3）
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          # 日本公式Xの告知は本文が極端に短く、開催時刻・会場・対象レベルが
          # 画像の中にしか無い（alt_text も空）。ここを飛ばすと
          # 「明日以降の予定」ブロックが実質空になる。
          #
          # Vision 呼び出しは1枚10秒前後かかるため 2枚/回で回す。
          # 失敗しても後続（集計・要約）は止めない（本文だけでもレポートは作れる）。
          for i in $(seq 1 30); do
            out=$(curl -sS -b /tmp/cookie.txt -X POST "$BASE/api/_ops/meta/ocr" \
              -H 'content-type: application/json' -d '{"limit":2}' || echo '{}')
            echo "[$i] $(echo "$out" | jq -c '{ok,empty,failed,remaining,done}' 2>/dev/null || echo "$out")"
            # 注意: jq の `//` は null だけでなく **false も「空」として扱う**ため、
            #   .done // true  と書くと "done":false（まだ残っている）が true に化けて
            #   1回で打ち切られる。ここは必ず文字列として厳密比較する。
            rest=$(echo "$out" | jq -r 'if .remaining == null then 0 else .remaining end' 2>/dev/null || echo 0)
            fin=$(echo "$out" | jq -r 'if .done == true then "yes" else "no" end' 2>/dev/null || echo yes)
            if [ "$fin" = "yes" ] || [ "$rest" = "0" ]; then
              echo "画像OCR完了"; break
            fi
            sleep 2
          done
        continue-on-error: true

      - name: 集計（イベント抽出＋メタシェア計算）
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          curl -sS -b /tmp/cookie.txt -X POST "$BASE/api/_ops/meta/aggregate" \
            -H 'content-type: application/json' -d '{}' | tee /tmp/agg.json
          echo

      - name: 要約（LLM）
        if: ${{ inputs.skip_summarize != true }}
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          # 失敗しても前日分のレポートは保持される（サーバ側で kept_previous=true を返す）
          code=$(curl -sS -o /tmp/sum.json -w '%{http_code}' \
            -b /tmp/cookie.txt -X POST "$BASE/api/_ops/meta/summarize" \
            -H 'content-type: application/json' -d '{}')
          cat /tmp/sum.json; echo
          if [ "$code" != "200" ]; then
            echo "::warning::要約に失敗しました（HTTP $code）。前日のレポートを継続表示します"
          fi

      - name: 記憶層へ反映
        if: ${{ inputs.skip_summarize != true }}
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          curl -sS -b /tmp/cookie.txt -X POST "$BASE/api/_ops/meta/memory" \
            -H 'content-type: application/json' -d '{}' | tee /tmp/mem.json
          echo

      - name: 状態サマリ
        if: always()
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          curl -sS -b /tmp/cookie.txt "$BASE/api/_ops/meta/status" \
            | jq '{reports, sources_fail: [.sources[] | select(.fail_streak > 0) | {key, fail_streak, last_error}]}' \
            || echo "状態取得に失敗"
